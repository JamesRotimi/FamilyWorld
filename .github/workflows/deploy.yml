name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/family-asset-manager-YgbyQ
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy at a time; let in-progress ones finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/configure-pages@v5

      - run: npm ci

      - run: npm run build
        env:
          # GitHub Pages serves the site at /FamilyWorld/, so the build needs a basePath.
          PAGES_BASE_PATH: /FamilyWorld

      # Prevent Jekyll from processing _next/* assets.
      - run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
